<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FB Post Queue</title>
<style>
:root{--bg:#0e1a2b;--card:#172a45;--line:#27415f;--tx:#eaf1fb;--mu:#8ea6c4;--ok:#3ddc97;--due:#ffb84d;--late:#ff6b6b;--ac:#5aa8ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding:12px 12px 80px}
h1{font-size:19px;margin:4px 0 10px}.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
input[type=text],input[type=number],textarea{width:100%;background:#0e1a2b;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:10px;font:inherit;margin-bottom:8px}
textarea{height:60px;resize:vertical}
button{background:var(--ac);color:#06152b;border:0;border-radius:8px;padding:9px 12px;font:600 14px system-ui;cursor:pointer}
button.g{background:transparent;border:1px solid var(--line);color:var(--tx)}button.ok{background:var(--ok)}button.r{background:transparent;color:var(--late);border:1px solid var(--late)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}
.stat{color:var(--mu);font-size:13px;margin:6px 0}
.slot{margin:16px 0 6px;font-weight:700;display:flex;justify-content:space-between;border-bottom:2px solid var(--line);padding-bottom:4px}
.slot.due{color:var(--due);border-color:var(--due)}.slot.late{color:var(--late);border-color:var(--late)}
.p{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
.p img{width:84px;height:84px;object-fit:cover;border-radius:8px;flex:0 0 auto;background:#000}
.p .b{flex:1;min-width:0}.lk{color:var(--ac);font-size:12px;word-break:break-all;margin-bottom:6px}.cp{color:var(--mu);font-size:12px;margin-bottom:6px;max-height:34px;overflow:hidden}
.p button{padding:6px 9px;font-size:12px;margin:0 4px 4px 0}
#ban{display:none;position:fixed;left:10px;right:10px;bottom:10px;background:var(--due);color:#2a1a00;padding:14px;border-radius:10px;font-weight:700;z-index:9}
.empty{color:var(--mu);text-align:center;padding:24px}
</style></head><body>
<h1>FB Post Queue</h1>

<div class="box">
  <input type="text" id="link" placeholder="Blog post link">
  <textarea id="cap" placeholder="Caption (optional)"></textarea>
  <div class="row">
    <input type="file" id="img" accept="image/*" style="display:none">
    <button class="g" id="pick">📷 Image chuno</button>
    <button class="g" id="paste">📋 Link paste</button>
    <button id="add">➕ Queue mein daalo</button>
  </div>
  <div class="stat" id="fn">Image nahi chuni</div>
</div>

<div class="box">
  <div class="row">
    <span>Har slot mein posts:</span>
    <input type="number" id="per" min="1" max="30" style="width:70px;margin:0">
    <button class="g" id="resched">🔁 Overdue ko aage badhao</button>
    <button class="g" id="notif">🔔 Notification on</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="g" id="exp">⬇️ Backup</button>
    <button class="g" id="imp">⬆️ Restore</button>
    <input type="file" id="impf" accept=".json" style="display:none">
  </div>
  <div class="stat">Slots: roz 7 PM se 1 AM, har ghante (7 slots). Reminder sirf slot ke time par.</div>
</div>

<div class="stat" id="st"></div>
<div id="list"></div>
<div id="ban"></div>

<script>
const $=s=>document.querySelector(s);
const H=[19,20,21,22,23,24,25];
const LS=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let PER=LS('per_v2',1),notified=LS('notified',{}),db,urls=[],file=null,lastKey='';

function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('fbq',1);
r.onupgradeneeded=()=>r.result.createObjectStore('posts',{keyPath:'id',autoIncrement:true});
r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
const st=m=>db.transaction('posts',m).objectStore('posts');
const all=()=>new Promise(r=>{const q=st('readonly').getAll();q.onsuccess=()=>r(q.result)});
const put=p=>new Promise(r=>{const q=st('readwrite').put(p);q.onsuccess=()=>r(q.result)});
const del=id=>new Promise(r=>{const q=st('readwrite').delete(id);q.onsuccess=()=>r()});

function slotsFrom(t){const out=[],d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-1);
for(let i=0;i<500;i++){for(const h of H){const s=new Date(d);s.setHours(h,0,0,0);if(s.getTime()>t)out.push(s.getTime())}d.setDate(d.getDate()+1)}return out}
function pick(cnt,now){for(const s of slotsFrom(now)){if((cnt[s]||0)<PER){cnt[s]=(cnt[s]||0)+1;return s}}}
function counts(ps,now){const c={};ps.forEach(p=>{if(p.slot>now)c[p.slot]=(c[p.slot]||0)+1});return c}

const fmt=s=>{const d=new Date(s),t=new Date(),y=new Date();y.setDate(t.getDate()+1);
const day=d.toDateString()===t.toDateString()?'Aaj':d.toDateString()===y.toDateString()?'Kal':d.toLocaleDateString([], {day:'numeric',month:'short'});
return day+', '+d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})};
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function render(){
  urls.forEach(u=>URL.revokeObjectURL(u));urls=[];
  const now=Date.now(),ps=(await all()).sort((a,b)=>a.slot-b.slot||a.id-b.id);
  syncNotifs(ps);let due=0,late=0;
  const g={};ps.forEach(p=>{(g[p.slot]=g[p.slot]||[]).push(p);
    if(p.slot+36e5<=now)late++;else if(p.slot<=now)due++});
  $('#st').textContent='Queue mein '+ps.length+' posts • Abhi due: '+due+' • Overdue: '+late;
  if(!ps.length){$('#list').innerHTML='<div class="empty">Queue khaali hai. Upar se link aur image daalo.</div>';return}
  let h='';
  for(const s of Object.keys(g)){
    const n=+s,cls=n+36e5<=now?'late':n<=now?'due':'';
    const tag=cls==='late'?'Overdue':cls==='due'?'Abhi post karo':'';
    h+='<div class="slot '+cls+'"><span>'+fmt(n)+'</span><span>'+tag+' ('+g[s].length+')</span></div>';
    for(const p of g[s]){
      const u=p.img?URL.createObjectURL(p.img):'';if(u)urls.push(u);
      h+='<div class="p" data-id="'+p.id+'"><img src="'+u+'" alt=""><div class="b">'
      +'<div class="lk">'+esc(p.link)+'</div>'+(p.caption?'<div class="cp">'+esc(p.caption)+'</div>':'')
      +'<button class="g" data-a="cl">Copy Link</button>'
      +(p.caption?'<button class="g" data-a="cc">Copy Caption</button>':'')
      +(p.img?'<button class="g" data-a="si">Save Image</button>':'')
      +'<button class="ok" data-a="ok">✅ Posted</button>'
      +'<button class="r" data-a="rm">Delete</button></div></div>';
    }
  }
  $('#list').innerHTML=h;
}

async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('Copy ho gaya')}
function toast(m){const b=$('#ban');b.textContent=m;b.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>b.style.display='none',2200)}

let lastSig='';
async function syncNotifs(ps){
  const LN=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;if(!LN)return;
  const now=Date.now(),c={};ps.forEach(p=>{if(p.slot>now)c[p.slot]=(c[p.slot]||0)+1});
  const sig=JSON.stringify(c);if(sig===lastSig)return;lastSig=sig;
  try{const pr=await LN.requestPermissions();if(pr.display!=='granted')return;
    const pend=await LN.getPending();if(pend.notifications.length)await LN.cancel({notifications:pend.notifications});
    const list=Object.keys(c).map(Number).sort((a,b)=>a-b).slice(0,100).map(s=>({id:Math.floor(s/6e4),title:'Post karne ka time',body:c[s]+' post(s) Facebook par daalo',schedule:{at:new Date(s),allowWhileIdle:true}}));
    if(list.length)await LN.schedule({notifications:list})}catch(e){}}
async function nativeShare(blob,name){const P=Capacitor.Plugins,d=await blob2url(blob);
  const r=await P.Filesystem.writeFile({path:name,data:d.split(',')[1],directory:'CACHE'});await P.Share.share({files:[r.uri]})}
$('#pick').onclick=()=>$('#img').click();
$('#img').onchange=e=>{file=e.target.files[0]||null;$('#fn').textContent=file?'Image: '+file.name:'Image nahi chuni'};
$('#paste').onclick=async()=>{try{$('#link').value=await navigator.clipboard.readText()}catch(e){toast('Paste allow nahi hua, link khud paste karo')}};
$('#add').onclick=async()=>{
  const link=$('#link').value.trim();if(!link){toast('Pehle link daalo');return}
  const now=Date.now(),ps=await all(),slot=pick(counts(ps,now),now);
  await put({link,caption:$('#cap').value.trim(),img:file,slot,added:now});
  $('#link').value='';$('#cap').value='';$('#img').value='';file=null;$('#fn').textContent='Image nahi chuni';
  toast('Queue mein add: '+fmt(slot));render()};
$('#per').value=PER;
$('#per').onchange=e=>{PER=Math.max(1,+e.target.value||1);SV('per_v2',PER)};
$('#resched').onclick=async()=>{
  const now=Date.now(),ps=await all(),c=counts(ps,now);
  const late=ps.filter(p=>p.slot+36e5<=now).sort((a,b)=>a.slot-b.slot||a.id-b.id);
  for(const p of late){p.slot=pick(c,now);await put(p)}
  toast(late.length+' posts aage badhaye');render()};
$('#list').onclick=async e=>{
  const a=e.target.dataset.a;if(!a)return;
  const id=+e.target.closest('.p').dataset.id,p=(await all()).find(x=>x.id===id);if(!p)return;
  if(a==='cl')copy(p.link);
  else if(a==='cc')copy(p.caption);
  else if(a==='si'){const f=new File([p.img],'post-'+id+'.jpg',{type:p.img.type||'image/jpeg'});
    if(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()){try{await nativeShare(p.img,f.name)}catch(e){toast('Image share nahi hui')}}
    else if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}}
    else{const u=URL.createObjectURL(p.img),l=document.createElement('a');l.href=u;l.download=f.name;l.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}}
  else if(a==='ok'){await del(id);toast('Posted ✅ queue se hata diya');render()}
  else if(a==='rm'&&confirm('Ye post delete karni hai?')){await del(id);render()}};

function ping(n){
  const m=n+' post(s) Facebook par daalne ka time ho gaya';
  const b=$('#ban');b.textContent='⏰ '+m;b.style.display='block';
  try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
  try{if(Notification.permission==='granted')new Notification('Post karne ka time',{body:m,tag:'fbq'})}catch(e){}
  try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();o.stop(c.currentTime+.4)}catch(e){}
}
$('#ban').onclick=()=>$('#ban').style.display='none';
$('#notif').onclick=async()=>{try{const r=await Notification.requestPermission();toast(r==='granted'?'Notification on':'Notification blocked')}catch(e){toast('Is browser mein notification nahi hai')}};

async function tick(){
  const now=Date.now(),ps=await all(),due={};
  ps.forEach(p=>{if(p.slot<=now&&now<p.slot+36e5)due[p.slot]=(due[p.slot]||0)+1});
  for(const s in due){if(!notified[s]){notified[s]=1;SV('notified',notified);ping(due[s])}}
  const k=Math.floor(now/6e4)+'|'+ps.length;if(k!==lastKey){lastKey=k;render()}
}

const blob2url=b=>new Promise(r=>{if(!b)return r(null);const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
$('#exp').onclick=async()=>{
  const ps=await all(),out=[];
  for(const p of ps)out.push({...p,img:await blob2url(p.img),imgType:p.img&&p.img.type});
  const u=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'})),a=document.createElement('a');
  a.href=u;a.download='fb-queue-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};
$('#imp').onclick=()=>$('#impf').click();
$('#impf').onchange=async e=>{
  try{const arr=JSON.parse(await e.target.files[0].text());
    for(const p of arr){delete p.id;p.img=p.img?await (await fetch(p.img)).blob():null;delete p.imgType;await put(p)}
    toast(arr.length+' posts restore hue');render()}catch(x){toast('Backup file sahi nahi hai')}};

(async()=>{await openDB();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  await render();tick();setInterval(tick,15000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()})})();
</script></body></html>
